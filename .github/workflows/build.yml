name: Build Project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-backend:
    name: Build Backend (.NET)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore Backend/Backend.slnx

      - name: Build backend
        run: dotnet build Backend/Backend.slnx --configuration Release --no-restore

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: Backend/**/bin/Release/
          if-no-files-found: error
          retention-days: 14

  build-frontend:
    name: Build Frontend (Expo Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Expo web export)
        working-directory: frontend
        run: npx expo export --platform web

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  build-ai:
    name: Build AI Service (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI/package-lock.json

      - name: Install AI dependencies
        working-directory: AI
        run: npm ci --omit=dev

      - name: Syntax check
        working-directory: AI
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

      # Startet den Service kurz mit Dummy-Werten. Schlägt fehl, wenn ein Import
      # fehlt oder der Server beim Start abstürzt. Es werden keine KI-Calls gemacht.
      - name: Smoke test (service starts)
        working-directory: AI
        env:
          AI_API_KEY: ci-dummy-key
          AI_BASE_URL: http://localhost:9999
          AI_MODEL_NAME: dummy
          AI_MODEL_NAME_DIAGNOSIS: dummy
          AI_MODEL_NAME_MEDICATION: dummy
          VALIDATOR_MODEL_NAME: dummy
          PORT: 3000
        run: |
          node aiServices.js > server.log 2>&1 &
          SERVER_PID=$!
          if curl -s -o /dev/null --retry 15 --retry-delay 1 --retry-connrefused http://localhost:3000/; then
            echo "AI service started successfully"
            kill $SERVER_PID
          else
            echo "AI service failed to start:"
            cat server.log
            exit 1
          fi

      - name: Package AI service
        run: tar --exclude='AI/.env' --exclude='AI/server.log' -czf ai-service.tar.gz AI

      - name: Upload AI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service
          path: ai-service.tar.gz
          if-no-files-found: error
          retention-days: 14
