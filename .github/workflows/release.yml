name: Release

# Zwei Wege zu einem Release:
#   1. In GitHub unter Actions > Release > "Run workflow" wählen, ob patch, minor
#      oder major erhöht werden soll. Die neue Version wird aus dem letzten Tag
#      berechnet, das Tag wird erst angelegt, wenn alles grün ist.
#   2. Lokal ein Tag pushen:  git tag v1.2.3 && git push origin v1.2.3
#
# In beiden Fällen wird die Version in Backend, Frontend und AI-Service gesetzt,
# alles gebaut und ein GitHub-Release mit den Artefakten erstellt.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Welcher Teil der Version wird erhöht? (SemVer)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  # Für den CodeQL-Job im aufgerufenen build.yml
  actions: read
  security-events: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ─── Version ermitteln ──────────────────────────────────────────────────────

  version:
    name: Version ermitteln
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version berechnen
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
            LAST="${LAST_TAG#v}"
            [ -z "$LAST" ] && LAST="0.0.0"
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Letztes Tag: ${LAST_TAG:-keins}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ungültige Version '$VERSION'. Erwartet wird vMAJOR.MINOR.PATCH, z. B. v1.2.3"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION existiert bereits."
            exit 1
          fi

          echo "Neue Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # ─── Tests & Checks (bestehender Build-Workflow) ────────────────────────────

  ci:
    name: CI
    uses: ./.github/workflows/build.yml

  # ─── Versionierte Builds ────────────────────────────────────────────────────

  release-backend:
    name: Release-Build Backend
    runs-on: windows-latest
    needs: [version, ci]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish backend
        run: >
          dotnet publish Backend/Backend/Backend.csproj
          --configuration Release
          -p:Version=${{ env.VERSION }}
          --output publish/backend

      - name: Package backend
        shell: pwsh
        run: Compress-Archive -Path publish/backend/* -DestinationPath "fehldiagnosen-backend-v$env:VERSION.zip"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-backend
          path: fehldiagnosen-backend-v${{ env.VERSION }}.zip
          if-no-files-found: error

  release-frontend:
    name: Release-Build Frontend
    runs-on: ubuntu-latest
    needs: [version, ci]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Version in package.json und app.json (Expo, per Constants.expoConfig.version abrufbar)
      - name: Set version
        working-directory: frontend
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = process.env.VERSION;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Build frontend (Expo web export)
        working-directory: frontend
        run: npx expo export --platform web

      - name: Package frontend
        working-directory: frontend/dist
        run: zip -r "$GITHUB_WORKSPACE/fehldiagnosen-frontend-web-v$VERSION.zip" .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: fehldiagnosen-frontend-web-v${{ env.VERSION }}.zip
          if-no-files-found: error

  release-ai:
    name: Release-Build AI Service
    runs-on: ubuntu-latest
    needs: [version, ci]
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI/package-lock.json

      - name: Install AI dependencies
        working-directory: AI
        run: npm ci --omit=dev

      # Version in package.json (per GET /ai/version abrufbar)
      - name: Set version
        working-directory: AI
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package AI service
        run: tar --exclude='AI/.env' -czf "fehldiagnosen-ai-service-v$VERSION.tar.gz" AI

      - name: Upload AI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ai
          path: fehldiagnosen-ai-service-v${{ env.VERSION }}.tar.gz
          if-no-files-found: error

  # ─── GitHub Release ─────────────────────────────────────────────────────────

  publish:
    name: GitHub Release erstellen
    runs-on: ubuntu-latest
    needs: [version, release-backend, release-frontend, release-ai]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Legt das Tag (falls noch nicht vorhanden) auf dem gebauten Commit an
      # und erzeugt die Release Notes automatisch aus den Commits/PRs seit dem letzten Tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
