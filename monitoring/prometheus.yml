# Prometheus fragt alle 15 Sekunden die /metrics-Endpoints ab.
# Start: npm run monitoring:up  →  http://localhost:9090 (Targets unter Status → Targets)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # AI-Service läuft im selben Compose-Netz
  - job_name: ai
    static_configs:
      - targets: ["ai:3000"]

  # Backend läuft außerhalb von Docker (Windows-OCR), daher über den Host
  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:5238"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
