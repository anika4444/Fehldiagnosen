# Loki speichert die Logs (wie Prometheus die Metriken). Einzelner Prozess, Daten im Container.
# Logs bekommt Loki von Alloy (monitoring/alloy/config.alloy), Grafana fragt sie hier ab.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Felder wie request_id und level als "structured metadata" statt als Label (Labels nur für service)
  allow_structured_metadata: true
  # Pegel aus dem Feld "level" ableiten, damit Grafana Logs nach Fehler/Warnung färbt und filtert
  discover_log_levels: true
  retention_period: 168h # 7 Tage

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
