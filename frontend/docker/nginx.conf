server {
    listen 80;
    root /usr/share/nginx/html;

    # Expo Router (output: static) erzeugt pro Route eine .html-Datei.
    # Unbekannte Pfade fallen auf index.html zurück, die App übernimmt das Routing.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Gebaute Dateien haben einen Hash im Namen und dürfen lange gecacht werden
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
